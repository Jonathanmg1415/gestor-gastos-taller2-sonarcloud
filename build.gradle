plugins {
    id 'java'
    id 'application'
    id 'me.champeau.jmh' version '0.7.3'
    id 'jacoco'
    id 'org.sonarqube' version '7.3.1.8318'
}

group = 'com.practica'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.practica.expensetracker.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'

    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    // 0.8.14 es la primera versión con soporte oficial de Java 25
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'Jonathanmg1415_gestor-gastos-taller2-sonarcloud'
        property 'sonar.organization', 'jonathanmg1415'
        property 'sonar.host.url', 'https://sonarcloud.io'
        // La UI Swing y Main no tienen pruebas unitarias: se excluyen solo de la cobertura
        property 'sonar.coverage.exclusions', '**/ui/**,**/Main.java'
    }
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 3
    iterations = 5
    fork = 1
    if (project.hasProperty('benchmark')) {
        includes = [project.property('benchmark')]
    }
}
